name: Release

# Publish the Windows installer whenever the application version is bumped on
# main. The release is created from the exact merge commit, and the package
# version is the source of truth for the tag (for example, 0.5.3 -> v0.5.3).
#
# The installed app is offline-only: latest.yml is included as build metadata
# alongside the installer, but updates are distributed through local installers
# rather than an in-app network updater.

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-app/package.json'
      - 'desktop-app/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: desktop-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Run full Electron end-to-end checks
        run: npx electron scripts/e2e-analysis.cjs

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-test-evidence
          path: نتائج-الفحص/**
          if-no-files-found: warn

      - name: Package Windows x64 NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/latest.yml)

          if [[ ${#assets[@]} -lt 3 ]]; then
            echo "Expected installer, blockmap and latest.yml; found ${#assets[@]} release assets." >&2
            printf 'Found: %s\n' "${assets[@]}" >&2
            exit 1
          fi

          echo "Publishing ${tag} from commit ${GITHUB_SHA}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --title "${tag}" \
              --notes "Automated Windows x64 desktop release ${tag}. Built from ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}"
          fi
